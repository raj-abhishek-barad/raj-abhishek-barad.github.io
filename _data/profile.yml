about_paragraphs:
  - >-
    I am Abhishek Barad, a researcher and engineer working at the intersection
    of optimal control, aerospace guidance, and autonomous systems. My work has
    focused on applying optimal control theory to real-world challenges —
    including planetary soft landing and safe trajectory generation for
    spacecraft operating in uncertain environments.
  - >-
    Beyond aerospace, I am deeply interested in Robotics — particularly in
    bridging the gap between theoretical control methods and physical robotic
    systems. I have hands-on experience with ROS2 and Gazebo for simulation
    and deployment, as well as Unity for building interactive 3D environments
    and hardware-in-the-loop testing scenarios.
  - >-
    I enjoy working on problems that sit at the edge of what's understood —
    where rigorous mathematics meets real engineering constraints. If you are
    working on something at that intersection, I would love to connect.

