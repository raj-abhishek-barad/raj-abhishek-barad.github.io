about_paragraphs:
  - "I work on autonomous planetary landing guidance with an emphasis on fuel efficiency and safety under constraints. My recent work spans free-final-time optimization, bounded thrust, thrust-lag modeling, and decreasing-horizon MPC validated in simulation with terrain and navigation uncertainty."
  - "I am interested in the interface between optimal control, real-time guidance, and robust navigation, especially where hard constraints must be enforced online."

keywords:
  - "Free-final-time guidance and fuel-optimal descent"
  - "Constrained thrust (magnitude / cone) and thrust-lag dynamics"
  - "Receding-horizon / decreasing-horizon MPC for terminal descent"
  - "State estimation and navigation error modeling"

