about_paragraphs:
  - "I work on autonomous planetary landing guidance with an emphasis on fuel efficiency and safety under constraints. My recent work spans free-final-time optimization, bounded thrust, thrust-lag modeling, and closed-form guidance law developed from OCP; validated in simulation with terrain and navigation uncertainty."
  - "I am interested in the interface between optimal control, real-time guidance, and PINNs, especially where hard constraints must be enforced online."

keywords:
  - "Free-final-time guidance and fuel-efficient descent"
  - "Constrained thrust(non-zero lower bound)"
  - "Closed-form guidance law for on-board use"
  - "Barrier-formation for collision avoidance"

