{% assign p = site.data.profile %}
<header class="top">
  <div class="wrap">
    <div class="hero">
      <div class="hero-left">
        <div class="name">{{ p.name }}</div>
        <div class="subtitle">{{ p.title_line }}</div>
        <div class="affil">{{ p.affiliation }}</div>
        <div class="emails">
          {% for e in p.emails %}
            <span>{{ e }}</span>{% unless forloop.last %},{% endunless %}
          {% endfor %}
        </div>
      </div>
      <div class="hero-right">
        <img class="avatar" src="{{ p.profile_image | relative_url }}" alt="{{ p.name }} profile photo" />
        <div class="links">
          {% for l in p.links %}
            <a class="link" href="{{ l.url }}" {% if l.url contains 'http' %}target="_blank" rel="noreferrer"{% endif %}>{{ l.label }}</a>
          {% endfor %}
        </div>
      </div>
    </div>

    <nav class="nav" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#news">News</a>
      <a href="#publications">Publications</a>
      <a href="#teaching">Teaching</a>
      <a href="#gallery">Typography</a>
      <a href="#vitae">Vitæ</a>
    </nav>
  </div>
</header>
